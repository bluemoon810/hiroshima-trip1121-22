<title>広島 旅の予習帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{--paper:#f5f6f3;--ink:#17212b;--muted:#5d6a72;--line:#d9dedd;--sea:#dcebef;--hero:#14304a;--accent:#d6452c;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;--gothic:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10171c;--ink:#e9eef0;--muted:#98a7ad;--line:#29363d;--sea:#1b3139;--hero:#0b1d2e;--accent:#ef6a50}}
:root[data-theme="dark"]{--paper:#10171c;--ink:#e9eef0;--muted:#98a7ad;--line:#29363d;--sea:#1b3139;--hero:#0b1d2e;--accent:#ef6a50}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--gothic);line-height:1.85}
button{font:inherit;color:inherit}
.hero{position:relative;background:var(--hero);color:#f3f6f6;padding:36px 24px 64px;overflow:hidden;
  background-image:radial-gradient(circle at 50% 100%,transparent 0 40%,rgba(255,255,255,.07) 41% 43%,transparent 44% 56%,rgba(255,255,255,.07) 57% 59%,transparent 60%);background-size:72px 36px}
.hero-in{max-width:560px;margin:0 auto;display:flex;gap:22px;align-items:flex-start}
.hero h1{margin:0;font-family:var(--mincho);font-weight:800;font-size:5.4rem;line-height:1.05;letter-spacing:.12em;writing-mode:vertical-rl}
.hero p{margin:6px 0 0;font-size:.9rem;color:#c3d1d6;letter-spacing:.06em}
.hero .t{font-family:var(--mincho);font-weight:700;font-size:1.35rem;color:#fff;margin:0 0 10px}
main{max-width:560px;margin:0 auto;padding:0 16px 56px}
.map{margin-top:-40px;background:var(--sea);border-radius:6px;overflow:hidden;box-shadow:0 14px 30px -18px rgba(10,30,50,.5)}
svg{display:block;width:100%;height:auto}
.pin{cursor:pointer;outline:none}
.pin .dot{fill:var(--accent);stroke:#fff;stroke-width:5;transform-box:fill-box;transform-origin:center;transition:transform .2s}
.pin:active .dot,.pin.on .dot{transform:scale(1.22)}
.pin:focus-visible .hit{stroke:var(--ink);stroke-width:3;stroke-dasharray:6 5}
.hit{fill:transparent;stroke:transparent}
.num{fill:#fff;font:700 30px var(--gothic);pointer-events:none}
.nm{fill:#14304a;font:800 32px var(--mincho);paint-order:stroke;stroke:#fff;stroke-width:9;stroke-linejoin:round;pointer-events:none}
.spot-img{pointer-events:none}
.note{margin:10px 2px 0;font-size:.78rem;color:var(--muted)}
h2{font-family:var(--mincho);font-weight:800;font-size:1.5rem;letter-spacing:.08em;margin:44px 2px 6px}
.lead{margin:0 2px 8px;color:var(--muted);font-size:.9rem}
.rows{margin:0;padding:0;list-style:none;border-top:1px solid var(--ink)}
.rows>li{border-bottom:1px solid var(--line)}
.row{width:100%;min-height:68px;display:flex;align-items:center;gap:16px;background:none;border:0;padding:10px 2px;text-align:left;cursor:pointer}
.row .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 1rem var(--gothic)}
.row .tt{flex:1;font-family:var(--mincho);font-weight:700;font-size:1.1rem;line-height:1.45}
.row small{display:block;font:400 .8rem var(--gothic);color:var(--muted)}
.row .go{flex:none;width:10px;height:10px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:rotate(45deg);margin-right:6px}
.acc .row .tt{font-size:1.02rem}
.acc .pm{flex:none;position:relative;width:16px;height:16px;margin-right:4px}
.acc .pm::before,.acc .pm::after{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--accent);transition:transform .25s}
.acc .pm::after{transform:rotate(90deg)}
.acc.open .pm::after{transform:rotate(0)}
.acc .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc.open .body{grid-template-rows:1fr}
.acc .body>div{overflow:hidden}
.acc .body p{margin:0;padding:0 2px 18px;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(8,18,28,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:30;background:var(--paper);border-radius:18px 18px 0 0;max-height:84vh;overflow-y:auto;
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,.28)}
.sheet.show{transform:none}
.sh-top{background:var(--sea);height:132px;display:flex;align-items:center;justify-content:center;gap:22px;padding:0 56px 0 20px;border-radius:18px 18px 0 0;position:relative}
.sh-top img{max-height:96px;max-width:44%;object-fit:contain;min-width:0}
.sh-top.one img{max-width:70%}
.close{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);cursor:pointer;font-size:1.05rem}
.sh-body{padding:18px 22px calc(32px + env(safe-area-inset-bottom,0px))}
.sh-body h3{display:flex;align-items:center;gap:12px;margin:0 0 4px;font-family:var(--mincho);font-weight:800;font-size:1.45rem;line-height:1.4}
.sh-body h3 .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 .95rem var(--gothic)}
dl{margin:0}
dt{margin:22px 0 6px;padding-left:10px;border-left:3px solid var(--accent);font-family:var(--mincho);font-weight:700;font-size:.98rem}
dd{margin:0}
dd ul{margin:0;padding:0;list-style:none}
dd li{padding:8px 0;border-bottom:1px solid var(--line)}
dd li:first-child{border-top:1px solid var(--line)}
.qz{padding:26px 0 22px;border-top:1px solid var(--line)}
.qz:first-child{border-top:1px solid var(--ink)}
.qz-no{font:800 .95rem var(--mincho);color:var(--accent);letter-spacing:.12em}
.qz-t{margin:2px 0 16px;font:700 1.15rem/1.75 var(--mincho)}
.ch{width:100%;min-height:56px;display:flex;align-items:center;gap:14px;background:none;border:1px solid var(--line);border-radius:4px;padding:8px 14px;margin-bottom:8px;text-align:left;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.ch .k{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:700 .9rem var(--gothic)}
.ch.ok{background:var(--hero);border-color:var(--hero);color:#fff}
.ch.ok .k{background:#fff;color:var(--hero);border-color:#fff}
.ch.ng{border-color:var(--accent);color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
.ch.ng .k{border-color:var(--accent);color:var(--accent)}
.qz.done .ch{pointer-events:none}
.qz.done .ch:not(.ok):not(.ng){opacity:.55}
.btns{display:flex;gap:10px;margin-top:6px}
.pill{min-height:48px;padding:0 20px;border-radius:24px;border:1px solid var(--ink);background:none;cursor:pointer;font-weight:700}
.pill.sub{border-color:var(--line);color:var(--muted);font-weight:400}
.res{margin:12px 0 0;font:700 1.05rem var(--mincho);min-height:1px}
.ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.qz.done .ans{grid-template-rows:1fr}
.ans>div{overflow:hidden}
.ans-in{margin-top:14px;padding:16px 18px;background:var(--sea);border-left:4px solid var(--accent);border-radius:0 4px 4px 0}
.ans-in h4{margin:0 0 8px;font:800 1.15rem var(--mincho)}
.ans-in p{margin:0 0 8px;font-size:.95rem}
.ans-in p:last-child{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="hero"><div class="hero-in">
  <h1>広島</h1>
  <div><p class="t">旅の予習帳</p><p>平和公園・宮島・湯来温泉。<br>地図のピンをタップして、<br>行き先を予習しましょう。</p></div>
</div></header>
<main>

 {q:"厳島神社の鳥居は海の中に立っていますが、その高さは何メートルあるでしょうか？",c:["約6m","約16m","約56m"],a:1,title:"約16m",
  body:["厳島神社の鳥居は、約16mの高さがあります。","しかもこの鳥居は海底に埋め込まれているのではなく、自重で立っているだけです。","雨にも風にも負けず自重で立てるくらいなのでどれだけ重いのかと言うと…なんと約60トンです。","屋根の真下の部材（笠木と島木）が箱状になっているためそこに約4トンもの小石が入っているなどの工夫も取り入れられています。"]},
 {q:"原爆ドームは、元々はどんな建物だったでしょうか？",c:["産業奨励館","市立病院","プラネタリウム"],a:0,title:"産業奨励館",
  body:["原爆ドームは、元々は「広島県産業奨励館」という名前の建物でした。","1915年（大正4）年に広島県の物産品の販売促進を図る拠点として建てられ、当初は「広島県物産陳列館」という名前でした。","現在は原爆ドームとして原爆や戦争の悲惨さ、平和の尊さを後世に伝えていくために戦後当時の姿を維持させながら残されています。"]},
 {q:"厳島神社でお馴染みの「宮島」は、ある木製の道具が土産物として有名です。それは何でしょうか？",c:["菜箸","まな板","しゃもじ"],a:2,title:"しゃもじ",
  body:["宮島は、木製しゃもじが有名です。","昔、宮島には主となる産業がありませんでした。","そこで江戸時代の光明院の修行僧である誓信が、「弁財天」が手に持つ「琵琶（びわ）」と形状が似た「しゃもじ」を御山の神木で作り、それを土産物として参拝客に売り出すことを提案したことが始まりと言われています。"]}
];

const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim');let last=null;
function sec(h,node){const dt=document.createElement('dt');dt.textContent=h;const dd=document.createElement('dd');dd.appendChild(node);return[dt,dd]}
function txt(t){const p=document.createElement('p');p.style.margin='0';p.textContent=t;return p}
function openSheet(id){
  const s=SPOTS[id];if(!s)return;last=document.activeElement;
  document.getElementById('sNo').textContent=s.no;document.getElementById('sTitle').textContent=s.name;
  document.getElementById('sImg').src=document.getElementById('im-'+id).getAttribute('href');
  const ex=EXTRA[id],i2=document.getElementById('sImg2');
  if(ex){i2.src=ex.src;i2.alt=ex.alt;i2.style.display=''}else{i2.removeAttribute('src');i2.style.display='none'}
  document.getElementById('sTop').classList.toggle('one',!ex);
  const dl=document.getElementById('sBody');dl.innerHTML='';
  const ul=document.createElement('ul');s.points.forEach(p=>{const li=document.createElement('li');li.textContent=p;ul.appendChild(li)});
  [["概要",txt(s.desc)],["見どころ",ul]].concat((s.extra||[]).map(x=>[x.h,txt(x.t)])).forEach(([h,n])=>sec(h,n).forEach(e=>dl.appendChild(e)));
  document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('on',p.dataset.id===id));
  sheet.scrollTop=0;sheet.classList.add('show');scrim.classList.add('show');sheet.setAttribute('aria-hidden','false');
  document.getElementById('close').focus({preventScroll:true});
}
function closeSheet(){
  sheet.classList.remove('show');scrim.classList.remove('show');sheet.setAttribute('aria-hidden','true');
  document.querySelectorAll('.pin').forEach(p=>p.classList.remove('on'));if(last)last.focus({preventScroll:true});
}
document.querySelectorAll('.pin').forEach(p=>{p.addEventListener('click',()=>openSheet(p.dataset.id));
  p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSheet(p.dataset.id)}})});
document.querySelectorAll('.row[data-id]').forEach(b=>b.addEventListener('click',()=>openSheet(b.dataset.id)));
document.getElementById('close').addEventListener('click',closeSheet);scrim.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let y0=null;sheet.addEventListener('touchstart',e=>{y0=sheet.scrollTop===0?e.touches[0].clientY:null},{passive:true});
sheet.addEventListener('touchend',e=>{if(y0!==null&&e.changedTouches[0].clientY-y0>80)closeSheet();y0=null},{passive:true});
const quiz=document.getElementById('quiz');
QUIZ.forEach((d,qi)=>{
  const el=document.createElement('section');el.className='qz';
  const no=document.createElement('div');no.className='qz-no';no.textContent='第'+(qi+1)+'問';
  const q=document.createElement('p');q.className='qz-t';q.textContent=d.q;
  el.append(no,q);
  const chs=d.c.map((txt,i)=>{const b=document.createElement('button');b.className='ch';
    b.innerHTML='<span class="k"></span><span></span>';b.firstChild.textContent=i+1;b.lastChild.textContent=txt;
    b.addEventListener('click',()=>reveal(i));el.appendChild(b);return b});
  const btns=document.createElement('div');btns.className='btns';
  const show=document.createElement('button');show.className='pill';show.textContent='答えを見る';
  const again=document.createElement('button');again.className='pill sub';again.textContent='もう一度';again.hidden=true;
  btns.append(show,again);el.appendChild(btns);
  const res=document.createElement('p');res.className='res';res.setAttribute('aria-live','polite');el.appendChild(res);
  const ans=document.createElement('div');ans.className='ans';
  const inn=document.createElement('div');const box=document.createElement('div');box.className='ans-in';
  const h=document.createElement('h4');h.textContent='答え：'+d.title;box.appendChild(h);
  d.body.forEach(t=>{const p=document.createElement('p');p.textContent=t;box.appendChild(p)});
  inn.appendChild(box);ans.appendChild(inn);el.appendChild(ans);
  function reveal(picked){
    el.classList.add('done');show.hidden=true;again.hidden=false;
    chs[d.a].classList.add('ok');
    if(picked!==null&&picked!==d.a)chs[picked].classList.add('ng');
    res.textContent=picked===null?'':(picked===d.a?'正解です！':'おしい！正解は「'+d.c[d.a]+'」です。');
  }
  show.addEventListener('click',()=>reveal(null));
  again.addEventListener('click',()=>{el.classList.remove('done');chs.forEach(c=>c.classList.remove('ok','ng'));res.textContent='';show.hidden=false;again.hidden=true});
  quiz.appendChild(el);
});
</script>
</body>
</html>
